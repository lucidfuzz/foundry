<script src="foundry-runtime.js"></script>
<script>
// Render jobs from the app. evaluateJavascript can't wait for a promise, so each job posts its answer back through the
// bridge: FoundryNative.result(id, json) or FoundryNative.error(id, message). The job's options come from
// FoundryNative.job(id), so large scripts never pass through evaluateJavascript.
(function () {
  'use strict';
  let allFaces = null;
  async function fontsFor(script) {
    // Draw only once the fonts are loaded. Every bundled face is loaded once per page (they are local files), because
    // scripts also draw weights FoundryRuntime.fontsNeeded() doesn't list, such as bold IBM Plex Mono.
    allFaces = allFaces || Promise.all(Array.from(document.fonts, f => f.load().catch(() => null)));
    const wanted = FoundryRuntime.fontsNeeded(script);
    await Promise.race([
      Promise.all([allFaces].concat(wanted.map(f => document.fonts.load(f).catch(() => null)))),
      new Promise(r => setTimeout(r, 4000)),
    ]);
  }
  async function render(id) {
    const opts = JSON.parse(FoundryNative.job(id));
    if (!opts || typeof opts.script !== 'string') throw new Error('Render job ' + id + ' has no script');
    await fontsFor(opts.script);
    return FoundryRuntime.run(opts);
  }
  window.FoundryAndroid = {
    render(id) {
      render(id).then(
        r => FoundryNative.result(id, JSON.stringify(r)),
        e => FoundryNative.error(id, String(e && e.message ? e.message : e))
      );
      return true;
    },
  };
})();
</script>
