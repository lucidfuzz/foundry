<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Navie</title>
<link rel="icon" href="../icon-180.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="world-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
<style>
:root { --ground:#0B0C0E; --ink:#F1ECE2; --accent:#FF7A1A; --panel:#131518; --glow:#46E27A; --alert:#E3242B; --land:#0B0C0E; --route:#FF7A1A;
  --display:'Newsreader', Georgia, serif; --mono:'IBM Plex Mono', ui-monospace, monospace; --dw:600; --case:none; --radius:14px; --line:1px; --scale:1;
  --top:env(safe-area-inset-top, 0px); --bot:env(safe-area-inset-bottom, 0px); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--land); color:var(--ink); font-family:var(--mono); }
button { font:inherit; color:inherit; cursor:pointer; }
#map { position:fixed; inset:0; }
.hidden { display:none !important; }
.panel { background:color-mix(in srgb, var(--panel) 94%, transparent); color:var(--ink); border:var(--line) solid color-mix(in srgb, var(--ink) 22%, transparent);
  border-radius:var(--radius); box-shadow:0 8px 28px rgba(0,0,0,.28); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.label { font-family:var(--mono); font-size:calc(11px * var(--scale)); letter-spacing:.12em; text-transform:uppercase; opacity:.72; }
.display { font-family:var(--display); font-weight:var(--dw); text-transform:var(--case); }
.btn { min-height:48px; padding:0 18px; border-radius:calc(var(--radius) - 4px); border:var(--line) solid color-mix(in srgb, var(--ink) 30%, transparent); background:transparent; }
.btn.primary { background:var(--route); color:var(--on-route, var(--ground)); border-color:transparent; font-family:var(--display); font-weight:var(--dw); font-size:19px; text-transform:var(--case); }
.round { width:52px; height:52px; padding:0; display:grid; place-items:center; border-radius:50%; }
.round svg { width:24px; height:24px; }
/* Search */
#top { position:fixed; left:12px; right:12px; top:calc(var(--top) + 10px); z-index:5; }
#searchbar { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; }
#searchbar svg { width:20px; height:20px; flex:none; opacity:.7; }
#q { flex:1; min-width:0; height:44px; border:0; outline:0; background:transparent; color:var(--ink); font-family:var(--display); font-weight:var(--dw); font-size:calc(18px * var(--scale)); text-transform:var(--case); }
#q::placeholder { color:color-mix(in srgb, var(--ink) 55%, transparent); }
#worldbtn { width:44px; height:44px; border-radius:calc(var(--radius) - 4px); border:var(--line) solid color-mix(in srgb, var(--ink) 25%, transparent); background:linear-gradient(135deg, var(--ground) 0 50%, var(--route) 50% 100%); flex:none; }
#results { margin-top:8px; max-height:52vh; overflow:auto; padding:4px 0; }
.result { display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:12px 16px; min-height:56px; border:0; background:transparent; border-bottom:var(--line) solid color-mix(in srgb, var(--ink) 10%, transparent); }
.result:last-child { border-bottom:0; }
.result b { display:block; font-family:var(--display); font-weight:var(--dw); font-size:calc(17px * var(--scale)); text-transform:var(--case); }
.result small { display:block; opacity:.65; font-size:12px; margin-top:2px; }
.result .dist { margin-left:auto; font-size:12px; opacity:.6; white-space:nowrap; }
#lock { padding:12px 14px; margin-top:8px; display:flex; gap:10px; align-items:center; font-size:13px; }
/* Route choice */
#sheet { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:16px 14px calc(var(--bot) + 14px); border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0; }
#sheet header { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
#sheet h2 { margin:0; font-size:22px; line-height:1.15; flex:1; min-width:0; overflow-wrap:anywhere; }
#routes { display:grid; gap:8px; margin-bottom:12px; }
.route { display:grid; grid-template-columns:1fr auto; gap:2px 12px; text-align:left; padding:12px 14px; border-radius:calc(var(--radius) - 4px); border:2px solid color-mix(in srgb, var(--ink) 14%, transparent); background:transparent; }
.route.on { border-color:var(--route); background:color-mix(in srgb, var(--route) 12%, transparent); }
.route .t { font-family:var(--display); font-weight:var(--dw); font-size:calc(24px * var(--scale)); }
.route .meta { font-size:13px; opacity:.75; align-self:center; text-align:right; }
.route .via { grid-column:1 / -1; font-size:12px; opacity:.6; }
#modes { display:flex; gap:6px; margin-bottom:12px; }
#modes button { flex:1; min-height:44px; }
#modes button.on { background:color-mix(in srgb, var(--ink) 14%, transparent); }
#sheet .row { display:flex; gap:8px; }
#sheet .row .primary { flex:1; }
/* Navigation */
#banner { position:fixed; left:10px; right:10px; top:calc(var(--top) + 10px); z-index:5; padding:12px 14px 14px; }
#banner .who { margin-bottom:6px; }
#banner .main { display:flex; gap:14px; align-items:center; }
#arrow { width:calc(64px * var(--scale)); height:calc(64px * var(--scale)); flex:none; color:var(--route); }
#arrow svg { width:100%; height:100%; }
#bdist { font-size:calc(34px * var(--scale)); line-height:1; }
#bverb { font-size:calc(21px * var(--scale)); line-height:1.15; margin-top:4px; overflow-wrap:anywhere; }
#broad { font-size:calc(15px * var(--scale)); line-height:1.2; margin-top:2px; opacity:.85; overflow-wrap:anywhere; }
#then { margin-top:10px; padding-top:8px; border-top:var(--line) solid color-mix(in srgb, var(--ink) 16%, transparent); display:flex; gap:8px; align-items:center; font-size:14px; }
#then svg { width:22px; height:22px; color:var(--route); }
#strip { position:fixed; left:10px; right:10px; bottom:calc(var(--bot) + 104px); z-index:5; padding:10px 14px; font-size:calc(13px * var(--scale)); line-height:1.35; }
#strip b { font-family:var(--display); font-weight:var(--dw); font-size:15px; text-transform:var(--case); display:block; }
#bar { position:fixed; left:10px; right:10px; bottom:calc(var(--bot) + 10px); z-index:5; padding:10px 10px 10px 14px; display:grid; grid-template-columns:repeat(3, minmax(0, auto)) 1fr; align-items:center; gap:4px 14px; }
#bar .cell { min-width:0; }
#bar .label { font-size:calc(10px * var(--scale)); letter-spacing:.06em; overflow-wrap:anywhere; }
#bar .v { font-family:var(--display); font-weight:var(--dw); font-size:calc(19px * var(--scale)); line-height:1.1; overflow-wrap:anywhere; }
#bar .btn { justify-self:end; max-width:104px; padding:4px 10px; line-height:1.15; }
#bar .grow { flex:1; }
#side { position:fixed; right:12px; bottom:calc(var(--bot) + 190px); z-index:4; display:grid; gap:10px; }
body.sim #strip { bottom:calc(var(--bot) + 160px); }
body.sim #side { bottom:calc(var(--bot) + 250px); }
#credit { position:fixed; left:10px; bottom:calc(var(--bot) + 4px); z-index:3; font-size:10px; opacity:.7; color:var(--ink); text-shadow:0 0 3px var(--land); }
#credit a { color:inherit; }
body.nav #credit, body.route #credit { bottom:auto; top:calc(var(--top) + 2px); }
/* Arrival */
#arrive { position:fixed; left:12px; right:12px; bottom:calc(var(--bot) + 12px); z-index:7; padding:20px 18px; text-align:center; }
#arrive h1 { margin:8px 0 6px; font-size:34px; line-height:1.05; }
#arrive p { margin:0 0 16px; opacity:.8; }
/* World picker */
#worlds { position:fixed; inset:0; z-index:8; overflow:auto; padding:calc(var(--top) + 14px) 14px calc(var(--bot) + 20px); border-radius:0; }
#worlds header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
#worlds h2 { margin:0; flex:1; font-size:26px; }
#worldlist { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
.filters { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; margin:0 -14px; padding-left:14px; padding-right:14px; scrollbar-width:none; }
.filters button { flex:none; min-height:40px; padding:0 14px; border-radius:20px; border:var(--line) solid color-mix(in srgb, var(--ink) 25%, transparent); background:transparent; white-space:nowrap; }
.filters button.on { background:var(--route); color:var(--on-route); border-color:transparent; }
#count { margin:4px 0 10px; }
.world { padding:0; border-radius:12px; overflow:hidden; border:var(--line) solid color-mix(in srgb, var(--ink) 18%, transparent); text-align:left; display:flex; flex-direction:column; }
.world.on { outline:3px solid var(--route); outline-offset:1px; grid-column:1 / -1; }
.world svg.thumb { display:block; width:100%; height:84px; }
.world .txt { padding:8px 10px 10px; }
.world b { font-size:17px; display:block; line-height:1.15; }
.world small { display:block; opacity:.75; font-size:11.5px; margin-top:3px; line-height:1.35; }
.world .tags { font-size:10px; letter-spacing:.06em; text-transform:uppercase; opacity:.6; margin-top:5px; }
.world.on small { font-size:12.5px; }
.swatches { display:flex; gap:8px; flex-wrap:wrap; padding:0 10px 12px; }
.sw { width:44px; height:44px; border-radius:50%; border:2px solid rgba(127,127,127,.4); padding:0; }
.sw.on { border-color:currentColor; box-shadow:0 0 0 2px var(--route); }
.settings { margin-top:16px; display:grid; gap:12px; padding:14px; }
.seg { display:flex; gap:6px; }
.seg button { flex:1; min-height:44px; }
.seg button.on { background:color-mix(in srgb, var(--ink) 16%, transparent); border-color:var(--route); }
#sim { position:fixed; left:10px; bottom:calc(var(--bot) + 104px); z-index:6; display:flex; gap:6px; padding:6px; font-size:12px; }
#sim button { min-height:40px; padding:0 10px; }
#toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--bot) + 120px); z-index:9; padding:10px 16px; font-size:13px; max-width:90vw; }
.marker { width:48px; height:48px; }
.marker svg { width:48px; height:48px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
/* Panel frames for Navie's own themes (kit.js NAV_FRAMES). Foundry worlds use their [data-world] rules instead. */
[data-frame=rounded] .panel { border-radius:16px; }
[data-frame=square] .panel { border-radius:0; }
[data-frame=pill] .panel { border-radius:28px; }
[data-frame=bubble] .panel { border-radius:22px; border:3px solid var(--ink); box-shadow:0 5px 0 color-mix(in srgb, var(--ink) 80%, transparent); }
[data-frame=sticker] .panel { border-radius:18px; border:4px solid #FFFFFF; box-shadow:0 0 0 2px var(--ink), 0 6px 14px rgba(0,0,0,.25); }
[data-frame=double] .panel { border-radius:6px; border:4px double var(--ink); }
[data-frame=bevel] .panel { border-radius:0; border:3px solid; border-color:color-mix(in srgb, #FFFFFF 70%, var(--panel)) color-mix(in srgb, #000000 45%, var(--panel)) color-mix(in srgb, #000000 45%, var(--panel)) color-mix(in srgb, #FFFFFF 70%, var(--panel)); }
[data-frame=neon] .panel { border-radius:12px; border:2px solid var(--accent); box-shadow:0 0 12px var(--accent), inset 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent); }
[data-frame=notch] .panel { border-radius:0; clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
[data-frame=ticket] .panel { border-radius:10px; border:2px dashed color-mix(in srgb, var(--ink) 45%, transparent); box-shadow:0 0 0 4px var(--panel), 0 6px 16px rgba(0,0,0,.2); }
[data-frame=tape] .panel { border-radius:2px; border:0; border-top:9px solid color-mix(in srgb, var(--accent) 45%, transparent); box-shadow:3px 4px 0 color-mix(in srgb, var(--ink) 22%, transparent); }
[data-frame=stitch] .panel { border-radius:14px; border:2px dashed var(--ink); outline:4px solid var(--panel); }
[data-frame=deco] .panel { border-radius:0; border:1px solid var(--accent); outline:1px solid var(--accent); outline-offset:-6px; }
[data-frame=chalk] .panel { border-radius:6px; border:3px solid color-mix(in srgb, var(--ink) 75%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ink) 30%, transparent); }
[data-frame=clear] .panel { border-radius:12px; border:3px solid var(--ink); background:var(--panel); backdrop-filter:none; -webkit-backdrop-filter:none; box-shadow:none; }
/* Each world frames its panels its own way (identity is locked per world: WORLD-BUILDING STANDARD 2). */
[data-world=halcyon] .panel { border-radius:6px; border-top:2px solid var(--ink); }
[data-world=directive] .panel { border-radius:0; border-left:4px solid var(--accent); }
[data-world=longroad] .panel { border-radius:4px; border:3px double color-mix(in srgb, var(--ink) 45%, transparent); }
[data-world=nightfall] .panel { border-radius:0; clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
[data-world=grimoire] .panel { border:2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline:1px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset:-6px; }
[data-world=deeprange] .panel { border-radius:0; border-color:color-mix(in srgb, var(--ink) 30%, transparent); background:color-mix(in srgb, var(--panel) 90%, transparent); }
[data-world=rabbit] .panel { border-radius:26px; }
[data-world=neon] .panel { border-radius:4px; border-color:var(--glow); box-shadow:0 0 14px color-mix(in srgb, var(--glow) 45%, transparent), inset 0 0 10px color-mix(in srgb, var(--accent) 20%, transparent); }
[data-world=vapor] .panel { border-radius:0; border:2px solid; border-color:#FFFFFF #404040 #404040 #FFFFFF; }
[data-world=wild] .panel { border-radius:18px; border:1.5px dashed color-mix(in srgb, var(--ink) 35%, transparent); }
[data-world=odds] .panel { border-radius:2px; border-color:color-mix(in srgb, var(--glow) 40%, transparent); }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div id="top">
  <div id="searchbar" class="panel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" autocomplete="off" enterkeyhint="search" aria-label="Search for a place">
    <button id="worldbtn" aria-label="Pick a theme"></button>
  </div>
  <div id="lock" class="panel hidden"><span>Typing is locked while moving.</span><button id="passenger" class="btn">I'm a passenger</button></div>
  <div id="results" class="panel hidden" role="listbox"></div>
</div>

<div id="side">
  <button id="mute" class="panel round hidden" aria-label="Mute voice"></button>
  <button id="recenter" class="panel round" aria-label="Center on my position"><svg viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z" fill="currentColor"/></svg></button>
</div>

<section id="sheet" class="panel hidden" aria-label="Route choices">
  <header><div style="flex:1;min-width:0"><div class="label" id="routesLabel"></div><h2 class="display" id="destName"></h2></div><button id="cancel" class="btn round" aria-label="Close">✕</button></header>
  <div id="modes"><button class="btn on" data-mode="car">Drive</button><button class="btn" data-mode="bike">Bike</button><button class="btn" data-mode="foot">Walk</button></div>
  <div id="routes"></div>
  <div class="row"><button id="go" class="btn primary"></button></div>
</section>

<section id="banner" class="panel hidden" aria-live="polite">
  <div class="label who" id="who"></div>
  <div class="main"><div id="arrow"></div><div style="min-width:0"><div class="display" id="bdist"></div><div class="display" id="bverb"></div><div id="broad"></div></div></div>
  <div id="then" class="hidden"></div>
</section>
<div id="strip" class="panel hidden"></div>
<section id="bar" class="panel hidden">
  <div class="cell"><div class="label" id="etaLabel"></div><div class="v" id="eta"></div></div>
  <div class="cell"><div class="label" id="leftLabel"></div><div class="v" id="left"></div></div>
  <div class="cell"><div class="label">&nbsp;</div><div class="v" id="leftDist"></div></div>
  <button id="end" class="btn"></button>
</section>

<section id="arrive" class="panel hidden">
  <div class="label" id="arriveLabel"></div>
  <h1 class="display" id="arriveHead"></h1>
  <p id="arriveSub"></p>
  <button id="done" class="btn primary" style="width:100%">Done</button>
</section>

<section id="worlds" class="panel hidden" aria-label="Themes and settings">
  <header><h2 class="display">Pick a theme</h2><button id="closeWorlds" class="btn round" aria-label="Close">✕</button></header>
  <div class="filters" id="ageFilter" role="group" aria-label="Who it suits"></div>
  <div class="filters" id="vibeFilter" role="group" aria-label="Style"></div>
  <div class="label" id="count"></div>
  <div id="worldlist"></div>
  <div class="settings panel">
    <div class="label">Voice</div>
    <div class="seg" id="styleSeg"><button class="btn" data-style="plain">Plain</button><button class="btn" data-style="light">Light</button><button class="btn" data-style="full">Full</button></div>
    <small id="styleNote" style="opacity:.7"></small>
    <div class="label">Distances</div>
    <div class="seg" id="unitSeg"><button class="btn" data-units="auto">Auto</button><button class="btn" data-units="imperial">Miles</button><button class="btn" data-units="metric">Kilometers</button></div>
    <small style="opacity:.7">Only your route and search text leave this phone, to the free OpenStreetMap services credited on the map. Nothing else is collected.</small>
  </div>
</section>

<div id="sim" class="panel hidden"><span class="label" style="align-self:center">Sim</span><button class="btn" data-speed="1">1x</button><button class="btn" data-speed="4">4x</button><button class="btn" data-speed="10">10x</button><button class="btn" id="wrong">Wrong turn</button></div>
<div id="toast" class="panel hidden" role="status"></div>
<div id="credit"></div>

// Geometry and formatting for Navie. Coordinates are [lon, lat] like GeoJSON; distances are meters.
const NAV_EARTH = 6371008.8;
const navRad = d => d * Math.PI / 180, navDeg = r => r * 180 / Math.PI;

function navDistance(a, b) {
  const dLat = navRad(b[1] - a[1]), dLon = navRad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(navRad(a[1])) * Math.cos(navRad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * NAV_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
}

  switch (kind) {
    case 'dots': for (const [x, y] of [[8, 8], [24, 24]]) for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) put(x + dx, y + dy, dx && dy ? 0.5 : 1); break;
    case 'scan': for (let y = 0; y < S; y += 4) for (let x = 0; x < S; x++) put(x, y); break;
    case 'paper': for (let i = 0; i < 40; i++) put(Math.floor(rnd() * S), Math.floor(rnd() * S), 0.4 + rnd() * 0.6); break;
    case 'hatch': for (let i = 0; i < S; i++) { put(i, i); put(i, i + 16); } break;
    case 'rain': for (const [x0, y0] of [[3, 2], [19, 9], [11, 20], [27, 25]]) for (let k = 0; k < 7; k++) put(x0 + Math.floor(k / 3), y0 + k, 1 - k / 9); break;
    case 'stars': for (let i = 0; i < 6; i++) { const x = Math.floor(rnd() * S), y = Math.floor(rnd() * S), big = i % 3 === 0; put(x, y); if (big) { put(x + 1, y, 0.6); put(x - 1, y, 0.6); put(x, y + 1, 0.6); put(x, y - 1, 0.6); } } break;
    case 'grid': for (let i = 0; i < S; i++) { put(i, 0); put(0, i); } for (let i = 0; i < S; i += 2) { put(i, 16, 0.5); put(16, i, 0.5); } break;
    case 'lattice': for (let i = 0; i < S; i++) { put(i, i, 0.8); put(S - 1 - i, i, 0.8); } break;
    case 'glitch': for (const [x0, y0, w] of [[2, 5, 9], [18, 13, 5], [7, 22, 12], [24, 29, 6]]) for (let x = 0; x < w; x++) put(x0 + x, y0); break;
    case 'checker': for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if ((x < 16) !== (y < 16)) put(x, y); break;
    case 'stipple': for (let i = 0; i < 22; i++) put(Math.floor(rnd() * S), Math.floor(rnd() * S), 0.5 + rnd() * 0.5); break;
    // Kit textures for Navie's own themes.
    case 'hearts': for (const [x0, y0] of [[5, 6], [21, 22]]) ['0101', '1111', '1111', '0110'].forEach((row, y) => [...row].forEach((v, x) => { if (v === '1') { put(x0 + x * 2, y0 + y * 2); put(x0 + x * 2 + 1, y0 + y * 2); put(x0 + x * 2, y0 + y * 2 + 1); put(x0 + x * 2 + 1, y0 + y * 2 + 1); } })); break;
    case 'sprinkles': for (let i = 0; i < 9; i++) { const x = Math.floor(rnd() * S), y = Math.floor(rnd() * S), d = [[1, 0], [0, 1], [1, 1], [1, -1]][i % 4]; for (let k = 0; k < 4; k++) put(x + d[0] * k, y + d[1] * k); } break;
    case 'waves': for (let x = 0; x < S; x++) for (const base of [8, 24]) put(x, Math.round(base + 2.5 * Math.sin(x / S * Math.PI * 2))); break;
    case 'bubbles': for (const [cx, cy, rr] of [[8, 9, 4], [23, 20, 6], [12, 26, 2.5]]) for (let a = 0; a < 64; a++) put(Math.round(cx + rr * Math.cos(a / 64 * Math.PI * 2)), Math.round(cy + rr * Math.sin(a / 64 * Math.PI * 2))); break;
    case 'gingham': for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const a = (x % 16) < 6, b = (y % 16) < 6; if (a || b) put(x, y, a && b ? 1 : 0.45); } break;
    case 'polka': for (const [cx, cy] of [[8, 8], [24, 24]]) for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) if (x * x + y * y <= 12) put(cx + x, cy + y); break;
    case 'sparkles': for (const [cx, cy, r] of [[8, 9, 4], [24, 23, 3], [26, 6, 2]]) { for (let k = -r; k <= r; k++) { put(cx + k, cy, 1 - Math.abs(k) / (r + 1)); put(cx, cy + k, 1 - Math.abs(k) / (r + 1)); } put(cx + 1, cy + 1, 0.5); put(cx - 1, cy - 1, 0.5); put(cx + 1, cy - 1, 0.5); put(cx - 1, cy + 1, 0.5); } break;
    case 'pixels': for (let i = 0; i < 7; i++) { const x = Math.floor(rnd() * 8) * 4, y = Math.floor(rnd() * 8) * 4; for (let dy = 0; dy < 4; dy++) for (let dx = 0; dx < 4; dx++) put(x + dx, y + dy); } break;
    case 'halftone': for (let y = 2; y < S; y += 6) for (let x = 2; x < S; x += 6) { const r = 0.6 + ((x + y) / (2 * S)) * 2; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (dx * dx + dy * dy <= r * r) put(x + dx, y + dy); } break;
    case 'chalk': for (let i = 0; i < 10; i++) { const x = Math.floor(rnd() * S), y = Math.floor(rnd() * S), len = 3 + Math.floor(rnd() * 5); for (let k = 0; k < len; k++) put(x + k, y + Math.round(k * 0.3), 0.3 + rnd() * 0.5); } break;
    case 'petals': for (const [cx, cy] of [[8, 8], [24, 22], [26, 4]]) { put(cx, cy - 1); put(cx - 1, cy); put(cx + 1, cy); put(cx, cy + 1); put(cx, cy, 0.4); } break;
    case 'zigzag': for (let x = 0; x < S; x++) { const t = x % 8, y = t < 4 ? t : 8 - t; put(x, 6 + y); put(x, 22 + y); } break;
    case 'weave': for (let y = 0; y < S; y += 8) for (let x = 0; x < S; x += 8) for (let k = 0; k < 5; k++) { if (((x + y) / 8) % 2) put(x + k, y + 2); else put(x + 2, y + k); } break;
    case 'finegrid': for (let i = 0; i < S; i++) { put(i, 0); put(0, i); for (const g of [8, 16, 24]) { put(i, g, 0.35); put(g, i, 0.35); } } break;
    case 'candles': for (const [x, y0, h] of [[4, 10, 12], [12, 6, 16], [20, 14, 9], [28, 4, 14]]) { for (let y = 0; y < h; y++) { put(x, y0 + y); put(x + 1, y0 + y); } put(x, y0 - 2, 0.6); put(x, y0 + h + 1, 0.6); } break;
  }
  return { width: S, height: S, data: px };
}

// Builds a MapLibre style for a world and colorway, over OpenFreeMap's tiles (the OpenMapTiles layers and classes).
// With fixture data (nav/fixture.js) the same layers draw the offline test town instead.
const NAV_TILES = 'https://tiles.openfreemap.org/planet';
const NAV_GLYPHS = 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';

function navRgb(hex) { const h = hex.replace('#', ''), n = parseInt(h.length === 3 ? h.replace(/./g, x => x + x) : h.slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function navHex(rgb) { return '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function navMix(a, b, t) { const x = navRgb(a), y = navRgb(b); return navHex(x.map((v, i) => v + (y[i] - v) * t)); }
function navRgba(hex, a) { const [r, g, b] = navRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function navLum(hex) { const c = navRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function navContrast(a, b) { const x = navLum(a), y = navLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }

// Theme + colorway -> every color the map and screen use. The route must stand out from the land: if the world's chosen
// route color is too close to the land in some colorway (contrast under 3), the casing carries it, or the best of the
// theme's own colors stands in.
function navPalette(theme, colorway) {
  const c = Object.assign({}, theme.colors, (colorway && colorway.colors) || {});
  const w = NAV_WORLDS[theme.id] || NAV_WORLDS.halcyon;
  const land = w.land(c), dark = navLum(land) < 0.18;
  const route = Object.assign({ width: 1 }, w.route(c));
  const routeSeen = r => Math.max(navContrast(r.line, land), r.casing ? navContrast(r.casing, land) : 0);
  if (routeSeen(route) < 3) route.line = [c.accent, c.alert, c.glow, c.ink].filter(Boolean).sort((a, b) => navContrast(b, land) - navContrast(a, land))[0];
  return {
    c, dark, land, world: w, route,
    water: w.water(c), park: w.park(c), wood: w.wood(c), roads: w.roads(c),
    building: w.buildingColor ? w.buildingColor(c) : navMix(land, c.ink, w.buildings === 'outline' ? 0.2 : 0.07),
    label: c.ink, halo: dark ? land : navMix(land, '#FFFFFF', 0.35), marker: w.markerColor ? w.markerColor(c) : route.line,
    texture: { kind: w.texture, color: w.textureColor(c), alpha: w.textureAlpha }
  };
}

function navStyle(theme, colorway, { fixture = null } = {}) {
  const p = navPalette(theme, colorway), w = p.world, R = p.roads, L = w.labels || {};
  const src = fixture ? Object.fromEntries(Object.entries(fixture).map(([k, data]) => [`fx-${k}`, { type: 'geojson', data }]))
    : { omt: { type: 'vector', url: NAV_TILES } };
  const from = (layer, def) => fixture ? Object.assign({ source: `fx-${layer}` }, def) : Object.assign({ source: 'omt', 'source-layer': layer }, def);
  const cls = list => ['match', ['get', 'class'], list, true, false];
  const zw = (stops, k = 1) => ['interpolate', ['exponential', 1.5], ['zoom'], ...stops.flatMap(([z, v]) => [z, v * k])];
  const name = ['coalesce', ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']];
  const text = L.upper ? ['upcase', name] : name;
  const font = [`Noto Sans ${L.font || 'Regular'}`];
  const roadW = { minor: [[12, 0.4], [14, 1.6], [16, 5], [18, 14]], major: [[8, 0.5], [12, 1.4], [14, 3.2], [16, 8], [18, 20]], motorway: [[5, 0.6], [9, 1.4], [12, 2.6], [14, 5], [16, 12], [18, 26]] };
  const roadLayers = [];
  const road = (id, classes, color, widths, extra = {}) => {
    if (R.casing) roadLayers.push(from('transportation', { id: `${id}-casing`, type: 'line', filter: cls(classes), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': R.casing, 'line-width': zw(widths.map(([z, v]) => [z, v + (z >= 14 ? 2 : 1)])) } }));
    roadLayers.push(from('transportation', Object.assign({ id, type: 'line', filter: cls(classes), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: Object.assign({ 'line-color': color, 'line-width': zw(widths) }, R.blur ? { 'line-blur': R.blur } : {}) }, extra)));
  };
  road('road-minor', ['minor', 'service', 'track'], R.minor, roadW.minor, { minzoom: 12 });
  road('road-major', ['primary', 'secondary', 'tertiary'], R.major, roadW.major);
  road('road-motorway', ['motorway', 'trunk'], R.motorway, roadW.motorway);
  const r = p.route, rw = [[8, 3], [12, 5], [14, 7], [16, 11], [18, 18]].map(([z, v]) => [z, v * (r.width || 1)]);
  const empty = { type: 'geojson', data: { type: 'FeatureCollection', features: [] } };
  return {
    version: 8, name: `Navie · ${theme.title}${colorway ? ` · ${colorway.name}` : ''}`, glyphs: NAV_GLYPHS,
    sources: Object.assign(src, { 'nav-alts': empty, 'nav-route': empty, 'nav-done': empty, 'nav-dest': empty }),
    layers: [
      { id: 'land', type: 'background', paint: { 'background-color': p.land } },
      ...(p.texture.kind && p.texture.kind !== 'none' ? [{ id: 'land-texture', type: 'background', paint: { 'background-pattern': navTextureId(p.texture.kind, p.texture.color, p.texture.alpha) } }] : []),
      from('landuse', { id: 'landuse', type: 'fill', filter: cls(['commercial', 'retail', 'industrial']), paint: { 'fill-color': navMix(p.land, p.c.ink, 0.04) } }),
      from('landcover', { id: 'wood', type: 'fill', filter: cls(['wood', 'forest']), paint: { 'fill-color': p.wood } }),
      from('landcover', { id: 'park', type: 'fill', filter: cls(['grass', 'farmland', 'park']), paint: { 'fill-color': p.park } }),
      from('park', { id: 'park-reserve', type: 'fill', paint: { 'fill-color': p.park, 'fill-opacity': 0.6 } }),
      from('water', { id: 'water', type: 'fill', paint: { 'fill-color': p.water } }),
      ...(w.waterTexture ? [from('water', { id: 'water-texture', type: 'fill', paint: { 'fill-pattern': navTextureId(w.waterTexture, p.c.ink, 0.16) } })] : []),
      from('waterway', { id: 'waterway', type: 'line', paint: { 'line-color': p.water, 'line-width': zw([[10, 0.6], [14, 2.5], [18, 8]]) } }),
      ...(w.buildings === 'none' ? [] : [from('building', w.buildings === 'outline'
        ? { id: 'building', type: 'line', minzoom: 14, paint: { 'line-color': p.building, 'line-width': 0.8 } }
        : { id: 'building', type: 'fill', minzoom: 14, paint: { 'fill-color': p.building, 'fill-outline-color': navMix(p.building, p.c.ink, 0.12) } })]),
      from('transportation', { id: 'path', type: 'line', minzoom: 14, filter: cls(['path']), paint: { 'line-color': R.minor, 'line-width': 1.2, 'line-dasharray': [2, 1.5] } }),
      from('transportation', { id: 'rail', type: 'line', minzoom: 11, filter: cls(['rail', 'transit']), paint: { 'line-color': navMix(p.land, p.c.ink, 0.3), 'line-width': 1.2, 'line-dasharray': [3, 2] } }),
      ...roadLayers,
      from('boundary', { id: 'boundary', type: 'line', filter: ['<=', ['get', 'admin_level'], 4], paint: { 'line-color': navMix(p.land, p.c.ink, 0.3), 'line-width': 1, 'line-dasharray': [4, 2] } }),
      // The route: alternatives under the chosen route; while driving, the part already driven is dimmed.
      { id: 'nav-alts', type: 'line', source: 'nav-alts', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': navMix(r.line, p.land, 0.55), 'line-width': zw(rw, 0.85) } },
      ...(r.glow ? [{ id: 'nav-route-glow', type: 'line', source: 'nav-route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': r.line, 'line-opacity': 0.45, 'line-blur': r.glow, 'line-width': zw(rw, 1.9) } }] : []),
      ...(r.casing ? [{ id: 'nav-route-casing', type: 'line', source: 'nav-route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': r.casing, 'line-width': zw(rw.map(([z, v]) => [z, v + 4])) } }] : []),
      { id: 'nav-route', type: 'line', source: 'nav-route', layout: { 'line-cap': r.dash ? 'butt' : 'round', 'line-join': 'round' }, paint: Object.assign({ 'line-color': r.line, 'line-width': zw(rw) }, r.dash ? { 'line-dasharray': r.dash } : {}) },
      { id: 'nav-done', type: 'line', source: 'nav-done', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': navMix(r.line, p.land, 0.7), 'line-width': zw(rw, 0.7) } },
      { id: 'nav-dest', type: 'circle', source: 'nav-dest', paint: { 'circle-radius': 9, 'circle-color': p.land, 'circle-stroke-color': r.line, 'circle-stroke-width': 4 } },
      // Labels.
      from('water_name', { id: 'water-name', type: 'symbol', layout: { 'text-field': name, 'text-font': [`Noto Sans Italic`], 'text-size': 12 }, paint: { 'text-color': navMix(p.water, p.c.ink, 0.6), 'text-halo-color': p.water, 'text-halo-width': 1 } }),
      from('transportation_name', { id: 'road-name', type: 'symbol', minzoom: 13, layout: { 'symbol-placement': 'line', 'text-field': text, 'text-font': font, 'text-size': zw([[13, 10], [17, 14]], L.size || 1), 'text-letter-spacing': L.spacing || 0 }, paint: { 'text-color': p.label, 'text-halo-color': p.halo, 'text-halo-width': 1.5 } }),
      from('poi', { id: 'poi', type: 'symbol', minzoom: 15, filter: ['<=', ['get', 'rank'], 25], layout: { 'text-field': text, 'text-font': font, 'text-size': 11 * (L.size || 1), 'text-max-width': 8, 'text-letter-spacing': L.spacing || 0 }, paint: { 'text-color': navMix(p.label, p.land, 0.25), 'text-halo-color': p.halo, 'text-halo-width': 1.5 } }),
      from('place', { id: 'place', type: 'symbol', filter: cls(['city', 'town', 'village', 'suburb', 'neighbourhood']), layout: { 'text-field': text, 'text-font': [`Noto Sans Bold`], 'text-size': ['match', ['get', 'class'], 'city', 18 * (L.size || 1), 'town', 15 * (L.size || 1), 12 * (L.size || 1)], 'text-letter-spacing': (L.spacing || 0) + 0.04, 'text-max-width': 8 }, paint: { 'text-color': p.label, 'text-halo-color': p.halo, 'text-halo-width': 2 } })
    ]
  };
}

// Texture images are named by kind, color and strength so a new world or colorway never reuses a stale tile; the app draws
// them when the map asks (styleimagemissing).
function navTextureId(kind, color, alpha) { return `tex-${kind}-${color.replace('#', '')}-${Math.round(alpha * 100)}`; }
function navTextureFromId(id) { const m = /^tex-(\w+)-([0-9A-Fa-f]{6})-(\d+)$/.exec(id); return m ? navTexture(m[1], '#' + m[2], +m[3] / 100) : null; }

// The position marker for a world as an SVG string (48x48, pointing north).
function navMarkerSvg(theme, colorway) {
  const p = navPalette(theme, colorway), draw = NAV_MARKERS[p.world.marker] || NAV_MARKERS.ring;
  const outline = navContrast(p.marker, p.c.ink) >= 2.5 ? p.c.ink : p.land;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">${draw(p.marker, outline)}</svg>`;
}

// The theme kit: Navie's own themes, each one plain data in nav/src/themes/*.js (navTheme({...})), turned here into the same
// three things a Foundry world has: a theme (NAV_THEMES), a map treatment (NAV_WORLDS) and a guide (NAV_VOICES).
// The picker filters every theme, Foundry worlds included, by who it suits (ages) and its style (vibes).
const NAV_AGES = { kids: 'Kids', teens: 'Teens', adults: 'Adults', clear: 'Easy to read' };
const NAV_VIBES = {
  cute: 'Cute', pastel: 'Pastel', bright: 'Bright', dark: 'Dark', retro: 'Retro', nature: 'Nature', fantasy: 'Fantasy',
  scifi: 'Sci-fi', minimal: 'Minimal', luxe: 'Luxe', cozy: 'Cozy', spooky: 'Spooky', playful: 'Playful', calm: 'Calm'
};
// Panel frames a theme can pick (CSS in page.html: [data-frame=...]).
const NAV_FRAMES = ['rounded', 'square', 'pill', 'bubble', 'sticker', 'double', 'bevel', 'neon', 'notch', 'ticket', 'tape', 'stitch', 'deco', 'chalk', 'clear'];
const NAV_ROUTE_STYLES = ['outlined', 'glow', 'dashed', 'solid'];
// Where the Foundry worlds sit in the picker.
const NAV_FOUNDRY_TAGS = {
  halcyon: { ages: ['teens', 'adults'], vibes: ['scifi', 'pastel'] }, directive: { ages: ['teens', 'adults'], vibes: ['dark', 'scifi'] },
  longroad: { ages: ['teens', 'adults'], vibes: ['fantasy', 'cozy'] }, nightfall: { ages: ['teens', 'adults'], vibes: ['dark', 'scifi'] },
  grimoire: { ages: ['teens', 'adults'], vibes: ['fantasy', 'dark'] }, deeprange: { ages: ['teens', 'adults'], vibes: ['dark', 'scifi'] },
  rabbit: { ages: ['teens', 'adults'], vibes: ['luxe', 'pastel'] }, neon: { ages: ['teens', 'adults'], vibes: ['dark', 'scifi', 'bright'] },
  vapor: { ages: ['teens', 'adults'], vibes: ['retro', 'pastel'] }, wild: { ages: ['kids', 'teens', 'adults'], vibes: ['nature', 'calm'] },
  odds: { ages: ['adults'], vibes: ['dark', 'retro'] }
};
for (const t of NAV_THEMES) Object.assign(t, { own: false }, NAV_FOUNDRY_TAGS[t.id] || { ages: ['adults'], vibes: [] });

// One theme = one call. Every color role can change per colorway; see docs/NAV_SPEC.md ("Adding a Navie theme").
//   colors: ground (land), ink (text), accent (route), panel, glow, alert, water, park, roads, highway (optional)
//   map: { texture, textureAlpha, textureRole, waterTexture, marker, route, routeWidth, labels, upper, buildings, labelSize }
//   frame, scale (screen text size, 1 = normal), voice { speaker, channel, rate, pitch, L, depart, arrive, reroute, cruise,
//   tags }, arrivals: [[line, line], ...] for the arrival card.
function navTheme(spec) {
  const m = spec.map || {}, f = spec.fonts;
  NAV_WORLDS[spec.id] = {
    texture: m.texture || 'none', textureColor: c => c[m.textureRole || 'ink'], textureAlpha: m.textureAlpha == null ? 0.07 : m.textureAlpha,
    waterTexture: m.waterTexture, marker: m.marker, markerColor: m.markerRole ? c => c[m.markerRole] : null,
    labels: { font: m.labels || 'Regular', upper: !!m.upper, spacing: m.upper ? 0.08 : 0, size: m.labelSize || 1 },
    land: c => c.ground, water: c => c.water, park: c => c.park, wood: c => navMix(c.park, c.ink, 0.08),
    roads: c => {
      const light = navLum(c.roads) > navLum(c.ground);
      return { minor: navMix(c.ground, c.roads, 0.72), major: c.roads, motorway: c.highway || navMix(c.roads, c.accent, 0.35), casing: light ? navMix(c.ground, c.ink, 0.2) : null, blur: m.roadGlow ? 1 : 0 };
    },
    buildings: m.buildings || 'fill',
    route: c => ({ line: c.accent, casing: m.route === 'outlined' ? c.ink : m.route === 'dashed' ? c.panel : null, dash: m.route === 'dashed' ? [1.6, 0.9] : null, glow: m.route === 'glow' ? 8 : 0, width: m.routeWidth || 1 })
  };
  NAV_VOICES[spec.id] = Object.assign({ rate: 1, pitch: 1 }, spec.voice);
  NAV_THEMES.push({
    id: spec.id, title: spec.title, blurb: spec.blurb, company: spec.title, upper: !!spec.upper, own: true,
    ages: spec.ages, vibes: spec.vibes, frame: spec.frame || 'rounded', scale: spec.scale || 1,
    colors: spec.colors, fonts: { display: f.display, mono: f.mono }, displayWeight: f.weight || 400, fontQuery: `${f.query}&display=swap`,
    phrases: spec.arrivals, slogans: [], editions: [],
    colorways: [{ name: spec.colorName || 'Original', colors: {} }].concat(spec.colorways || [])
  });
}

  // Textures: MapLibre never asks for a background layer's pattern, so every texture the style names is drawn on load.
  map.on('style.load', () => {
    for (const l of map.getStyle().layers) {
      const id = l.paint && (l.paint['background-pattern'] || l.paint['fill-pattern']), img = typeof id === 'string' && navTextureFromId(id);
      if (img && !map.hasImage(id)) map.addImage(id, img, { pixelRatio: 2 });
    }
    drawRoute();
  });
  map.on('dragstart', () => { if (S.mode === 'nav') S.following = false; });
  map.on('click', 'nav-alts', e => { const i = e.features[0] && e.features[0].properties.i; if (i != null) { S.pick = i; renderRoutes(); drawRoute(); } });
  map.on('contextmenu', e => dropPin(e.lngLat));
  let press = null;
  map.on('touchstart', e => { clearTimeout(press); if (e.points.length === 1) press = setTimeout(() => dropPin(e.lngLat), 650); });
  for (const ev of ['touchend', 'touchmove', 'movestart']) map.on(ev, () => clearTimeout(press));
  marker.setLngLat(map.getCenter()).addTo(map);
  applyWorld();
  $('credit').innerHTML = NAV_FIX ? 'Offline test town · invented map data' : '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> · OpenFreeMap · FOSSGIS routing · Photon';
  startLocation();
}
// For the screenshot harness and debugging. Nothing in the app depends on it.
window.FoundryMaps = {
  S, get map() { return map; },
  world(id, colorway = 0) { S.world = NAV_THEMES.find(t => t.id === id) || S.world; S.colorway = colorway; applyWorld(); },
  search: q => { $('q').value = q; return runSearch(q); },
  choose: (i = 0) => { const b = $('results').querySelectorAll('button.result')[i]; if (b) b.click(); },
  picker: (age = 'all', vibe = 'all') => { S.filterAge = age; S.filterVibe = vibe; renderWorlds(); $('worlds').classList.remove('hidden'); },
  here: coord => onFix({ coord, accuracy: 5, speed: 0, heading: 0, time: S.here ? S.here.time : Date.now() }),
  start: startNav, tick: (n = 1) => { let f = null; for (let i = 0; i < n && S.mode === 'nav'; i++) f = simTick(1); return f; },
  wrongTurn, end: endNav
};
if (NAV_FIX) { const s = document.createElement('script'); s.src = 'fixture.js'; s.onload = boot; s.onerror = () => toast('The test town could not load.'); document.head.appendChild(s); }
else boot();

</script>
